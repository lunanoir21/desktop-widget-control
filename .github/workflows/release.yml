name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^## $version " CHANGELOG.md || { echo "CHANGELOG.md has no entry for $version"; exit 1; }

      - name: Build the tarball
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="desktop-widget-control-$version"
          mkdir "$name"
          cp -r shell.qml ui bin assets packaging install.sh LICENSE README.md CHANGELOG.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$version" '$0 ~ "^## " v " " {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" --title "Desktop Widget Control $version" --notes "$notes" \
            "desktop-widget-control-$version.tar.gz" "desktop-widget-control-$version.tar.gz.sha256"
